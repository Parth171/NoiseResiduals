# Detector 2: Noise Residual CNN (ResNet18 on high-pass residual maps).

experiment_name: residual_cnn

model:
  arch: resnet18
  pretrained: false  # residual inputs are far from ImageNet statistics
  in_channels: 3

input:
  type: residual
  # one of: gaussian, laplacian, sobel, median, srm
  residual_method: gaussian
  # kernel size for gaussian/median blur used to compute x - blur(x)
  residual_kernel_size: 3 # changed from 5 to 3
  gaussian_sigma: 1.0

training:
  epochs: 15
  optimizer: adamw
  learning_rate: 1.0e-4
  weight_decay: 1.0e-4
  loss: bce
  select_by: auroc
